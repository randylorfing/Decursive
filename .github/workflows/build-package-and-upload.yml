name: Check and build addon

# Publishing is driven by version tags only. Branch pushes no longer build,
# because a branch build produced no artifact anyone could install while still
# consuming a run -- and, more importantly, the credential-carrying step now
# lives behind a gate that only a tag should ever open.
on:
  push:
    tags:
      - 'v*'
  # Manual rehearsal. Running this from the Actions tab executes `verify` only:
  # the `release` job is gated on a tag ref below, so a dispatch can lint,
  # package and validate without any possibility of publishing. This replaces
  # the rehearsal that branch builds used to provide.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 -- prove the build is sound WITHOUT any publishing credentials.
  #
  # This job has no secrets in scope at all. It packages with `-d` (skip
  # uploading) and then parses and inspects the packaged output. Nothing here
  # can reach CurseForge or create a release even if it wanted to.
  #
  # This ordering is the whole point. On a tag build the CurseForge upload
  # happens *inside* the packager step, so a check placed after that step only
  # reports a problem once the broken file is already published -- which is
  # exactly how v11.0.46, v12.0.4 and v12.0.5 escaped.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify (no credentials)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run luacheck
        uses: BigWigsMods/actions/luacheck@master
        with:
          args: -qo 011

      # Guards the root cause of the delimiter corruption. The packager appends
      # its own ]==] to any surviving --@end-debug@ closer, and where a long
      # comment was open the extra bracket is left as bare code.
      - name: Check for packager-rewritable debug markers
        run: |
          set -euo pipefail
          status=0
          if grep -rn --include='*.lua' -- '--@debug@\|--@end-debug@' Decursive Decursive_Options; then
            echo "::error::Found packager-rewritable @debug@/@end-debug@ markers (see above). The packager appends ]==] to these, producing ]==]]==] and a Lua syntax error. Space the markers out or remove them."
            status=1
          fi
          if grep -rn --include='*.lua' -e ']==]]==]' -e ']===]]===]' Decursive Decursive_Options; then
            echo "::error::Found a duplicated long-string delimiter (see above). This will not parse in game."
            status=1
          fi
          [ "$status" -eq 0 ] && echo "OK: no rewritable debug markers, no duplicated delimiters."
          exit "$status"

      # validate-v13.sh is built on ripgrep, which ubuntu-latest does not ship.
      # Without it every `rg` call exits 127 and the script's `! rg -q ...`
      # checks read as failures, reporting problems that do not exist.
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      # Repository-level invariants: workflow shape, package-token baseline,
      # licence and attribution metadata, and the v13 architecture boundaries.
      - name: Validate repository invariants
        run: bash .github/scripts/validate-v13.sh

      - name: Package (dry run, no upload)
        uses: BigWigsMods/packager@master
        with:
          args: -d

      - name: Validate packaged artifact
        run: bash .github/scripts/validate-package.sh .release

  # ---------------------------------------------------------------------------
  # Stage 2 -- publish. Runs only after `verify` succeeds, and is the only job
  # that is given publishing credentials.
  # ---------------------------------------------------------------------------
  release:
    name: Package and publish
    needs: verify
    # Only a version tag may publish. A manual dispatch stops after `verify`.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@master
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          GITHUB_API_TOKEN: ${{ github.token }}
