name: Check and build addon

# Verification runs for pull requests, master, alpha, version tags, and manual
# rehearsals. Publishing is still driven only by version tags, and the
# credential-carrying job remains behind a tag-only gate.
on:
  push:
    branches:
      - master
      - alpha
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - alpha
  # Manual rehearsal. Running this from the Actions tab executes `verify` only:
  # the `release` job requires a pushed tag below, so a dispatch can lint,
  # package and validate without any possibility of publishing, even when its
  # selected ref is a version tag. This replaces the rehearsal that branch
  # builds used to provide.
  workflow_dispatch:

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 -- prove the build is sound WITHOUT any publishing credentials.
  #
  # This job has no secrets in scope at all. It packages with `-d` (skip
  # uploading) and then parses and inspects the packaged output. Nothing here
  # can reach CurseForge or create a release even if it wanted to.
  #
  # This ordering is the whole point. On a tag build the CurseForge upload
  # happens *inside* the packager step, so a check placed after that step only
  # reports a problem once the broken file is already published -- which is
  # exactly how v11.0.46, v12.0.4 and v12.0.5 escaped.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify (no credentials)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The full legacy tree intentionally defines and consumes WoW globals, so
      # keep the all-source pass focused on syntax. A second pass below applies
      # correctness-oriented warnings to code maintained by this fork.
      - name: Parse all Lua sources with luacheck
        uses: BigWigsMods/actions/luacheck@a2a89117153b3f3036da956b6a55a7ae06c5340f # reviewed master 2026-08-27
        with:
          args: -qo 011

      - name: Run maintained-code static checks
        uses: BigWigsMods/actions/luacheck@a2a89117153b3f3036da956b6a55a7ae06c5340f # reviewed master 2026-08-27
        with:
          files: >-
            Decursive/DCR_init.lua
            Decursive/Dcr_12_1.lua
            Decursive/Dcr_12_1_Utils.lua
            Decursive/Dcr_12_1_DebuffIdentity.lua
            Decursive/Dcr_12_1_SoulLink.lua
            Decursive/Dcr_DIAG.lua
            Decursive/Dcr_DebuffsFrame.lua
            Decursive/Dcr_Events.lua
            Decursive/Dcr_LiveList.lua
            Decursive/Dcr_ProfileManager.lua
            Decursive/Dcr_ProfileIO.lua
            Decursive/Dcr_CureBindings.lua
            Decursive/Dcr_opt.lua
            Decursive/Dcr_preload.lua
            Decursive/Dcr_utils.lua
            Decursive/Decursive.lua
            Decursive/Database
            Decursive/Modern
            Decursive/V13
            Decursive_Options/Modern/ZD_UI.lua
            Decursive_Options/V13
          # Retain warnings with correctness impact (uninitialized values,
          # assignment arity, unreachable control flow, and malformed blocks)
          # while excluding intentional WoW globals, callback captures, unused
          # compatibility locals, whitespace, line-length policy, and the
          # original DCR_init.lua localization of Lua's `select` function.
          args: >-
            -q --codes --no-global
            --ignore 211 212 213 231 232 233 241 311 312 313 314 331
            421 422 423 431 432 433 611 612 613 614 621 631 411/select

      # Guards the root cause of the delimiter corruption. The packager appends
      # its own ]==] to any surviving --@end-debug@ closer, and where a long
      # comment was open the extra bracket is left as bare code.
      - name: Check for packager-rewritable debug markers
        run: |
          set -euo pipefail
          status=0
          if grep -rn --include='*.lua' -- '--@debug@\|--@end-debug@' Decursive Decursive_Options; then
            echo "::error::Found packager-rewritable @debug@/@end-debug@ markers (see above). The packager appends ]==] to these, producing ]==]]==] and a Lua syntax error. Space the markers out or remove them."
            status=1
          fi
          if grep -rn --include='*.lua' -e ']==]]==]' -e ']===]]===]' Decursive Decursive_Options; then
            echo "::error::Found a duplicated long-string delimiter (see above). This will not parse in game."
            status=1
          fi
          [ "$status" -eq 0 ] && echo "OK: no rewritable debug markers, no duplicated delimiters."
          exit "$status"

      # validate-v13.sh is built on ripgrep, which ubuntu-latest does not ship,
      # and its focused secure-action mocks require a Lua runtime.
      - name: Install repository validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep lua5.4

      # Repository-level invariants: workflow shape, package-token baseline,
      # licence and attribution metadata, and the v13 architecture boundaries.
      - name: Validate repository invariants
        run: bash .github/scripts/validate-v13.sh

      - name: Package (dry run, no upload)
        uses: BigWigsMods/packager@36b4c3b7b7bd17c835ad8c83fed4976c067edfbe # reviewed master 2026-08-27
        with:
          args: -d

      - name: Validate packaged artifact
        run: bash .github/scripts/validate-package.sh .release

  # ---------------------------------------------------------------------------
  # Stage 2 -- publish. Runs only after `verify` succeeds, and is the only job
  # that is given publishing credentials.
  # ---------------------------------------------------------------------------
  release:
    name: Package and publish
    needs: verify
    # Only a pushed version tag may publish. Even a manual dispatch whose
    # selected ref is an existing version tag stops after `verify`.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Package and upload
        uses: BigWigsMods/packager@36b4c3b7b7bd17c835ad8c83fed4976c067edfbe # reviewed master 2026-08-27
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          GITHUB_API_TOKEN: ${{ github.token }}
