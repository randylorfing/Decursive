name: ZDecursive v13.1.2 recovery publisher retired

# Apply this replacement only after confirming the recovery upload was accepted.
# Keep the registered filename for a harmless response to any later dispatch.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    name: Publication is retired
    runs-on: ubuntu-latest
    steps:
      - name: Explain release status
        shell: bash
        run: |
          echo 'The v13.1.2 recovery publisher was retired after the accepted upload.'
          echo 'Use a new version for subsequent changes. Keep the v13.1.2 tag unchanged.'
