name: Publish ZDecursive v13.1.0-alpha to CurseForge

run-name: Publish ZDecursive v13.1.0-alpha to CurseForge

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-zdecursive-v13.1.0-alpha-curseforge
  cancel-in-progress: false

env:
  TARGET_TAG: v13.1.0-alpha
  TARGET_SHA: f3ba81f0eacc2568a736d442c4968a61c10dc1f9
  ARCHIVE_NAME: ZDecursive-v13.1.0-alpha.zip
  PACKAGER_REVISION: 36b4c3b7b7bd17c835ad8c83fed4976c067edfbe
  VALIDATION_PACKAGE_JSON_GZ_B64: H4sIAAAAAAAACkXOOw6DMBCE4R6JO6y2DpZRkobbrPAkskSMtTYugrg7MuTR/vMVs7YNEQd5gQfit8O4aPIFnWKCJHRFJu8k+znw5bBRfZFcedYFZyvQVMVA3Btr7Ic6RASHMHokHmitkYgfCE9RX7U1vbmf+j90PmToHL/g9gPTIlE0HV+tuZqe67C1zbYDKhi0/cgAAAA=
  VALIDATION_PACKAGE_LOCK_GZ_B64: 

jobs:
  verify:
    name: Verify immutable tag without credentials
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      verified-sha: ${{ steps.identity.outputs.verified-sha }}
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: v13.1.0-alpha
          fetch-depth: 0
          persist-credentials: false

      - name: Verify annotated tag identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git cat-file -t "refs/tags/$TARGET_TAG")" = "tag"
          test "$(git rev-parse "refs/tags/$TARGET_TAG^{}")" = "$TARGET_SHA"
          printf 'verified-sha=%s\n' "$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Verified immutable annotated tag and commit."

      - name: Install integrity-locked validation runtimes
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/zdecursive-node"
          mkdir -p "$tools_dir"
          printf '%s' "$VALIDATION_PACKAGE_JSON_GZ_B64" | base64 --decode | gzip --decompress > "$tools_dir/package.json"
          printf '%s' "$VALIDATION_PACKAGE_LOCK_GZ_B64" | base64 --decode | gzip --decompress > "$tools_dir/package-lock.json"
          (
            cd "$tools_dir"
            npm ci --ignore-scripts --no-audit --no-fund
          )
          echo "NODE_PATH=$tools_dir/node_modules" >> "$GITHUB_ENV"

      - name: Validate maintained source
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-zdecursive-source.py \
            --root "$GITHUB_WORKSPACE" \
            --release-tag "$TARGET_TAG"

      - name: Run complete Lua regression suite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(find tests -maxdepth 1 -type f -name '*.lua' -print | sort)
          test "${#test_files[@]}" -eq 34
          for test_file in "${test_files[@]}"; do
            node tests/run-fengari.cjs "$test_file"
          done

      - name: Run diagnostics exporter contract
        shell: pwsh
        run: ./tests/export-diagnostics-contract.ps1

      - name: Fetch pinned BigWigs packager
        shell: bash
        run: |
          set -euo pipefail
          packager_dir="$RUNNER_TEMP/bigwigs-packager"
          git init "$packager_dir"
          git -C "$packager_dir" remote add origin https://github.com/BigWigsMods/packager.git
          git -C "$packager_dir" fetch --depth=1 origin "$PACKAGER_REVISION"
          git -C "$packager_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$packager_dir" rev-parse HEAD)" = "$PACKAGER_REVISION"

      - name: Assemble without publishing
        shell: bash
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/zdecursive-release"
          bash "$RUNNER_TEMP/bigwigs-packager/release.sh" \
            -d \
            -t "$GITHUB_WORKSPACE" \
            -r "$release_root"

      - name: Validate expanded package and ZIP
        shell: bash
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/zdecursive-release"
          mapfile -t archives < <(find "$release_root" -maxdepth 1 -type f -name 'ZDecursive-*.zip' -print)
          test "${#archives[@]}" -eq 1
          test "$(basename "${archives[0]}")" = "$ARCHIVE_NAME"
          python3 .github/scripts/validate-zdecursive-package.py \
            "$release_root" \
            --archive "${archives[0]}" \
            --source-root "$GITHUB_WORKSPACE" \
            --expected-version "$TARGET_TAG" \
            --expected-source-commit "$TARGET_SHA"

  publish-curseforge:
    name: Publish only to CurseForge
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.verify.result == 'success' &&
      needs.verify.outputs.verified-sha == 'f3ba81f0eacc2568a736d442c4968a61c10dc1f9'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: v13.1.0-alpha
          fetch-depth: 0
          persist-credentials: false

      - name: Re-check annotated tag identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git cat-file -t "refs/tags/$TARGET_TAG")" = "tag"
          test "$(git rev-parse "refs/tags/$TARGET_TAG^{}")" = "$TARGET_SHA"
          echo "Re-verified immutable annotated tag and commit."

      - name: Package and upload only to CurseForge
        uses: BigWigsMods/packager@36b4c3b7b7bd17c835ad8c83fed4976c067edfbe
        with:
          args: -p 1659159
          pandoc: false
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
