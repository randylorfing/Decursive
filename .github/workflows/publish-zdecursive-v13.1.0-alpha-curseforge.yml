name: Publish ZDecursive v13.1.0-alpha to CurseForge

run-name: Publish ZDecursive v13.1.0-alpha to CurseForge

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-zdecursive-v13.1.0-alpha-curseforge
  cancel-in-progress: false

env:
  TARGET_TAG: v13.1.0-alpha
  TARGET_SHA: f3ba81f0eacc2568a736d442c4968a61c10dc1f9
  CF_PROJECT_ID: "1659159"
  ARCHIVE_NAME: ZDecursive-v13.1.0-alpha.zip
  EXPECTED_ASSET_SHA256: 45bdbe1aac274ac5a6c7819e695998f55cdf4bd2407a49692c25fc435fce60b6
  PACKAGER_REVISION: 36b4c3b7b7bd17c835ad8c83fed4976c067edfbe
  CF_GAME_VERSION: "12.1.0"
  CF_RETAIL_GAME_VERSION_TYPE_ID: "517"
  VALIDATION_PACKAGE_JSON_GZ_B64: H4sIAAAAAAAACkXOOw6DMBCE4R6JO6y2DpZRkobbrPAkskSMtTYugrg7MuTR/vMVs7YNEQd5gQfit8O4aPIFnWKCJHRFJu8k+znw5bBRfZFcedYFZyvQVMVA3Btr7Ic6RASHMHokHmitkYgfCE9RX7U1vbmf+j90PmToHL/g9gPTIlE0HV+tuZqe67C1zbYDKhi0/cgAAAA=
  VALIDATION_PACKAGE_LOCK_GZ_B64: 

jobs:
  verify:
    name: Verify immutable tag without credentials
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      verified-sha: ${{ steps.identity.outputs.verified-sha }}
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: v13.1.0-alpha
          fetch-depth: 0
          persist-credentials: false

      - name: Verify annotated tag identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git cat-file -t "refs/tags/$TARGET_TAG")" = "tag"
          test "$(git rev-parse "refs/tags/$TARGET_TAG^{}")" = "$TARGET_SHA"
          printf 'verified-sha=%s\n' "$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Verified immutable annotated tag and commit."

      - name: Install integrity-locked validation runtimes
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/zdecursive-node"
          mkdir -p "$tools_dir"
          printf '%s' "$VALIDATION_PACKAGE_JSON_GZ_B64" | base64 --decode | gzip --decompress > "$tools_dir/package.json"
          printf '%s' "$VALIDATION_PACKAGE_LOCK_GZ_B64" | base64 --decode | gzip --decompress > "$tools_dir/package-lock.json"
          (
            cd "$tools_dir"
            npm ci --ignore-scripts --no-audit --no-fund
          )
          echo "NODE_PATH=$tools_dir/node_modules" >> "$GITHUB_ENV"

      - name: Validate maintained source
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-zdecursive-source.py \
            --root "$GITHUB_WORKSPACE" \
            --release-tag "$TARGET_TAG"

      - name: Run complete Lua regression suite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(find tests -maxdepth 1 -type f -name '*.lua' -print | sort)
          test "${#test_files[@]}" -eq 34
          for test_file in "${test_files[@]}"; do
            node tests/run-fengari.cjs "$test_file"
          done

      - name: Run diagnostics exporter contract
        shell: pwsh
        run: ./tests/export-diagnostics-contract.ps1

      - name: Fetch pinned BigWigs packager
        shell: bash
        run: |
          set -euo pipefail
          packager_dir="$RUNNER_TEMP/bigwigs-packager"
          git init "$packager_dir"
          git -C "$packager_dir" remote add origin https://github.com/BigWigsMods/packager.git
          git -C "$packager_dir" fetch --depth=1 origin "$PACKAGER_REVISION"
          git -C "$packager_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$packager_dir" rev-parse HEAD)" = "$PACKAGER_REVISION"

      - name: Assemble without publishing
        shell: bash
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/zdecursive-release"
          bash "$RUNNER_TEMP/bigwigs-packager/release.sh" \
            -d \
            -t "$GITHUB_WORKSPACE" \
            -r "$release_root"

      - name: Validate expanded package and ZIP
        shell: bash
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/zdecursive-release"
          mapfile -t archives < <(find "$release_root" -maxdepth 1 -type f -name 'ZDecursive-*.zip' -print)
          test "${#archives[@]}" -eq 1
          test "$(basename "${archives[0]}")" = "$ARCHIVE_NAME"
          python3 .github/scripts/validate-zdecursive-package.py \
            "$release_root" \
            --archive "${archives[0]}" \
            --source-root "$GITHUB_WORKSPACE" \
            --expected-version "$TARGET_TAG" \
            --expected-source-commit "$TARGET_SHA"

  publish-curseforge:
    name: Publish only to CurseForge
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.verify.result == 'success' &&
      needs.verify.outputs.verified-sha == 'f3ba81f0eacc2568a736d442c4968a61c10dc1f9'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: v13.1.0-alpha
          fetch-depth: 0
          persist-credentials: false

      - name: Re-check annotated tag identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git cat-file -t "refs/tags/$TARGET_TAG")" = "tag"
          test "$(git rev-parse "refs/tags/$TARGET_TAG^{}")" = "$TARGET_SHA"
          echo "Re-verified immutable annotated tag and commit."

      - name: Install integrity-locked post-upload validation runtime
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/zdecursive-node"
          mkdir -p "$tools_dir"
          printf '%s' "$VALIDATION_PACKAGE_JSON_GZ_B64" | base64 --decode | gzip --decompress > "$tools_dir/package.json"
          printf '%s' "$VALIDATION_PACKAGE_LOCK_GZ_B64" | base64 --decode | gzip --decompress > "$tools_dir/package-lock.json"
          (
            cd "$tools_dir"
            npm ci --ignore-scripts --no-audit --no-fund
          )
          echo "NODE_PATH=$tools_dir/node_modules" >> "$GITHUB_ENV"

      - name: Validate the approved GitHub archive without credentials
        shell: bash
        run: |
          set -euo pipefail
          approved_dir="$RUNNER_TEMP/approved-github-asset"
          release_root="$RUNNER_TEMP/approved-expanded"
          mkdir -p "$approved_dir" "$release_root"
          approved_zip="$approved_dir/$ARCHIVE_NAME"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "https://github.com/randylorfing/Decursive/releases/download/$TARGET_TAG/$ARCHIVE_NAME" \
            --output "$approved_zip"
          approved_hash="$(sha256sum "$approved_zip" | awk '{print $1}')"
          if [ "$approved_hash" != "$EXPECTED_ASSET_SHA256" ]; then
            echo "::error::The approved GitHub release asset hash does not match."
            exit 1
          fi
          unzip -q "$approved_zip" -d "$release_root"
          mapfile -t top_level < <(find "$release_root" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test "${#top_level[@]}" -eq 1
          test "${top_level[0]}" = "ZDecursive"
          python3 .github/scripts/validate-zdecursive-package.py \
            "$release_root" \
            --archive "$approved_zip" \
            --source-root "$GITHUB_WORKSPACE" \
            --expected-version "$TARGET_TAG" \
            --expected-source-commit "$TARGET_SHA"

      - name: Fail closed on duplicates and resolve Retail 12.1 metadata
        id: cf-preflight
        shell: bash
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${CURSEFORGE_API_KEY:-}"
          found=0
          completed=0
          for page in $(seq 0 9); do
            index=$((page * 50))
            response="$RUNNER_TEMP/cf-files-preflight-$page.json"
            status="$(curl --silent --show-error \
              --proto '=https' --tlsv1.2 \
              --output "$response" \
              --write-out '%{http_code}' \
              --header 'Accept: application/json' \
              --header "x-api-key: $CURSEFORGE_API_KEY" \
              "https://api.curseforge.com/v1/mods/$CF_PROJECT_ID/files?pageSize=50&index=$index")"
            if [ "$status" != "200" ]; then
              echo "::error::CurseForge duplicate check was unavailable (HTTP $status)."
              exit 1
            fi
            if ! jq -e '.data | type == "array"' "$response" >/dev/null; then
              echo "::error::CurseForge duplicate check returned an invalid response."
              exit 1
            fi
            count="$(jq '.data | length' "$response")"
            matches="$(jq \
              --arg version "$TARGET_TAG" \
              --arg archive "$ARCHIVE_NAME" \
              '[.data[] | select(.displayName == $version or .fileName == $archive)] | length' \
              "$response")"
            found=$((found + matches))
            if [ "$count" -lt 50 ]; then
              completed=1
              break
            fi
          done
          if [ "$completed" -ne 1 ]; then
            echo "::error::CurseForge duplicate check exceeded its bounded page limit."
            exit 1
          fi
          if [ "$found" -ne 0 ]; then
            echo "::error::The exact CurseForge version or archive name already exists; refusing to upload."
            exit 1
          fi

          versions_response="$RUNNER_TEMP/cf-game-versions.json"
          versions_status="$(curl --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --output "$versions_response" \
            --write-out '%{http_code}' \
            --header 'Accept: application/json' \
            --header "x-api-token: $CURSEFORGE_API_KEY" \
            'https://wow.curseforge.com/api/game/wow/versions')"
          if [ "$versions_status" != "200" ]; then
            echo "::error::CurseForge game-version metadata was unavailable (HTTP $versions_status)."
            exit 1
          fi
          version_id="$(jq -er \
            --arg name "$CF_GAME_VERSION" \
            --argjson type_id "$CF_RETAIL_GAME_VERSION_TYPE_ID" \
            '[.[] | select(.name == $name and .gameVersionTypeID == $type_id)] | if length == 1 then .[0].id else error("expected one exact Retail version") end' \
            "$versions_response")"
          if ! [[ "$version_id" =~ ^[0-9]+$ ]]; then
            echo "::error::CurseForge returned an invalid Retail game-version ID."
            exit 1
          fi
          printf 'game-version-id=%s\n' "$version_id" >> "$GITHUB_OUTPUT"
          echo "Authenticated duplicate and Retail 12.1 metadata checks passed."

      # Official multipart upload contract:
      # https://support.curseforge.com/support/solutions/articles/9000197321-curseforge-upload-api
      # This sends the already-approved GitHub release asset byte-for-byte.
      - name: Upload the exact approved ZIP through the official CurseForge API
        id: cf-upload
        shell: bash
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_GAME_VERSION_ID: ${{ steps.cf-preflight.outputs.game-version-id }}
        run: |
          set -euo pipefail
          test -n "${CURSEFORGE_API_KEY:-}"
          test -n "${CF_GAME_VERSION_ID:-}"
          approved_zip="$RUNNER_TEMP/approved-github-asset/$ARCHIVE_NAME"
          test "$(sha256sum "$approved_zip" | awk '{print $1}')" = "$EXPECTED_ASSET_SHA256"
          metadata="$RUNNER_TEMP/cf-upload-metadata.json"
          jq -n \
            --arg display_name "$TARGET_TAG" \
            --arg changelog "First alpha of the single-folder ZDecursive rebuild for Retail 12.1. Native protected-aura detection and MUFs, environment profiles, and sanitized copyable/persistent diagnostics with exporter. Automated source, Lua, exporter, XML/TOC, package, and archive validation passed; live WoW verification is still recommended." \
            --arg version_name "$CF_GAME_VERSION" \
            --argjson version_id "$CF_GAME_VERSION_ID" \
            '{displayName: $display_name, releaseType: "alpha", changelogType: "markdown", changelog: $changelog, gameVersions: [$version_id], gameVersionNames: [$version_name]}' \
            > "$metadata"

          response="$RUNNER_TEMP/cf-upload-response.json"
          status="$(curl --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --output "$response" \
            --write-out '%{http_code}' \
            --header 'Accept: application/json' \
            --header "x-api-token: $CURSEFORGE_API_KEY" \
            --form "metadata=<$metadata;type=application/json" \
            --form "file=@$approved_zip;type=application/zip" \
            "https://wow.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file")"
          if [ "$status" != "200" ]; then
            echo "::error::CurseForge upload failed closed (HTTP $status)."
            exit 1
          fi
          file_id="$(jq -er '.id | select(type == "number" and . > 0) | floor' "$response")"
          if ! [[ "$file_id" =~ ^[0-9]+$ ]]; then
            echo "::error::CurseForge upload returned an invalid file ID."
            exit 1
          fi
          printf 'file-id=%s\n' "$file_id" >> "$GITHUB_OUTPUT"
          echo "CurseForge accepted the approved ZIP as file ID $file_id."

      - name: Poll authenticated metadata for the uploaded file
        id: cf-file
        shell: bash
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_FILE_ID: ${{ steps.cf-upload.outputs.file-id }}
        run: |
          set -euo pipefail
          test -n "${CURSEFORGE_API_KEY:-}"
          test -n "${CF_FILE_ID:-}"
          download_url=""
          for attempt in $(seq 1 18); do
            response="$RUNNER_TEMP/cf-files-post-$attempt.json"
            status="$(curl --silent --show-error \
              --proto '=https' --tlsv1.2 \
              --output "$response" \
              --write-out '%{http_code}' \
              --header 'Accept: application/json' \
              --header "x-api-key: $CURSEFORGE_API_KEY" \
              "https://api.curseforge.com/v1/mods/$CF_PROJECT_ID/files/$CF_FILE_ID")"
            if [ "$status" = "200" ] && jq -e \
              --argjson project_id "$CF_PROJECT_ID" \
              --argjson file_id "$CF_FILE_ID" \
              --arg version "$TARGET_TAG" \
              --arg archive "$ARCHIVE_NAME" \
              --arg game_version "$CF_GAME_VERSION" \
              '.data | .modId == $project_id and .id == $file_id and .displayName == $version and .fileName == $archive and .releaseType == 3 and (.gameVersions | index($game_version) != null)' \
              "$response" >/dev/null; then
              download_url="$(jq -r '.data.downloadUrl // empty' "$response")"
              if [ -n "$download_url" ]; then
                break
              fi
            fi
            if [ "$attempt" -lt 18 ]; then
              sleep 10
            fi
          done
          if ! [[ "$download_url" =~ ^https://[A-Za-z0-9.-]+\.forgecdn\.net/[A-Za-z0-9._~/%?=\&+:-]+$ ]]; then
            echo "::error::The uploaded CurseForge file did not expose a valid public download URL within the bounded poll window."
            exit 1
          fi
          case "$download_url" in
            https://*.forgecdn.net/*) ;;
            *)
              echo "::error::CurseForge returned an untrusted download origin."
              exit 1
              ;;
          esac
          printf 'download-url=%s\n' "$download_url" >> "$GITHUB_OUTPUT"
          echo "CurseForge file ID $CF_FILE_ID exposes validated alpha metadata and a public download URL."

      - name: Verify published bytes and inventory without credentials
        shell: bash
        env:
          CF_DOWNLOAD_URL: ${{ steps.cf-file.outputs.download-url }}
          CF_FILE_ID: ${{ steps.cf-upload.outputs.file-id }}
        run: |
          set -euo pipefail
          if ! [[ "$CF_DOWNLOAD_URL" =~ ^https://[A-Za-z0-9.-]+\.forgecdn\.net/[A-Za-z0-9._~/%?=\&+:-]+$ ]]; then
            echo "::error::The sanitized CurseForge download URL is invalid."
            exit 1
          fi

          cf_dir="$RUNNER_TEMP/curseforge-verification"
          github_dir="$RUNNER_TEMP/github-verification"
          mkdir -p "$cf_dir" "$github_dir"
          cf_zip="$cf_dir/$ARCHIVE_NAME"
          github_zip="$github_dir/$ARCHIVE_NAME"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "$CF_DOWNLOAD_URL" --output "$cf_zip"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "https://github.com/randylorfing/Decursive/releases/download/$TARGET_TAG/$ARCHIVE_NAME" \
            --output "$github_zip"

          cf_hash="$(sha256sum "$cf_zip" | awk '{print $1}')"
          github_hash="$(sha256sum "$github_zip" | awk '{print $1}')"
          if [ "$cf_hash" != "$EXPECTED_ASSET_SHA256" ] || [ "$github_hash" != "$EXPECTED_ASSET_SHA256" ]; then
            echo "::error::Published archive hash does not match the approved GitHub asset."
            exit 1
          fi
          if ! cmp --silent "$cf_zip" "$github_zip"; then
            echo "::error::CurseForge and GitHub archives are not byte-identical."
            exit 1
          fi

          mkdir "$cf_dir/expanded" "$github_dir/expanded"
          unzip -q "$cf_zip" -d "$cf_dir/expanded"
          unzip -q "$github_zip" -d "$github_dir/expanded"
          python3 .github/scripts/validate-zdecursive-package.py \
            "$cf_dir/expanded" \
            --archive "$cf_zip" \
            --source-root "$GITHUB_WORKSPACE" \
            --expected-version "$TARGET_TAG" \
            --expected-source-commit "$TARGET_SHA"
          python3 .github/scripts/validate-zdecursive-package.py \
            "$github_dir/expanded" \
            --archive "$github_zip" \
            --source-root "$GITHUB_WORKSPACE" \
            --expected-version "$TARGET_TAG" \
            --expected-source-commit "$TARGET_SHA"

          (
            cd "$cf_dir/expanded"
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "$cf_dir/manifest.sha256"
          (
            cd "$github_dir/expanded"
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "$github_dir/manifest.sha256"
          if ! cmp --silent "$cf_dir/manifest.sha256" "$github_dir/manifest.sha256"; then
            echo "::error::CurseForge and GitHub expanded inventories differ."
            exit 1
          fi
          file_count="$(wc -l < "$cf_dir/manifest.sha256")"
          echo "Verified CurseForge file ID $CF_FILE_ID: approved hash and $file_count-file inventory match."
